[project]
name = "legate"
version = "0.0.1"
description = "Local coding/agent harness that drives small local models (and MCP servers like Praetor) via Goose."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
legate = "legate.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["legate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]

